<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" role="img" aria-label="KAHA 한국동물병원협회">
  <defs>
    <linearGradient id="kahaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
  </defs>
  <!-- 심볼: 발자국 + 십자(의료) -->
  <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#kahaGrad)"/>
  <!-- 발바닥 패드 -->
  <ellipse cx="48" cy="62" rx="17" ry="13.5" fill="#ffffff"/>
  <!-- 발가락 -->
  <ellipse cx="28" cy="44" rx="7" ry="9" fill="#ffffff" transform="rotate(-18 28 44)"/>
  <ellipse cx="42" cy="34" rx="7" ry="9.5" fill="#ffffff" transform="rotate(-6 42 34)"/>
  <ellipse cx="57" cy="34" rx="7" ry="9.5" fill="#ffffff" transform="rotate(6 57 34)"/>
  <ellipse cx="70" cy="44" rx="7" ry="9" fill="#ffffff" transform="rotate(18 70 44)"/>
  <!-- 패드 안 의료 십자 -->
  <rect x="44.5" y="53" width="7" height="18" rx="1.6" fill="#0e7490"/>
  <rect x="39" y="58.5" width="18" height="7" rx="1.6" fill="#0e7490"/>
  <!-- 워드마크 -->
  <text x="108" y="52" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif"
        font-size="40" font-weight="800" letter-spacing="2" fill="#134e5e">KAHA</text>
  <text x="109" y="78" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif"
        font-size="17" font-weight="600" letter-spacing="1" fill="#5b6b76">한국동물병원협회</text>
</svg>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>유튜브 요약 네이버 블로그용 초안</title>
<style>
  :root { --ink:#22303b; --soft:#5b6b76; --accent:#0e7490; --line:#dde4e7; --bg:#fafaf8; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#d9e2e8; --soft:#8fa1ac; --accent:#4cc4dd; --line:#26333d; --bg:#10171d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); line-height:1.8;
    font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif; }
  .wrap { max-width:42rem; margin:0 auto; padding:1.5rem 1.25rem 4rem; }
  .meta { font-size:0.85rem; color:var(--soft); border:1px solid var(--line);
    border-radius:10px; padding:0.8rem 1rem; margin-bottom:1.2rem; }
  .btns { display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1.6rem; }
  button { font:inherit; font-size:0.9rem; font-weight:600; color:#fff;
    background:var(--accent); border:none; border-radius:8px; padding:0.6rem 1.1rem; cursor:pointer; }
  button.secondary { color:var(--accent); background:transparent; border:1.5px solid var(--accent); }
  h1 { font-size:1.4rem; line-height:1.4; }
  article h3 { font-size:1.05rem; margin-top:1.8em; }
  article a { color:var(--accent); }
  article img { max-width:100%; height:auto; border-radius:8px; border:1px solid var(--line); }
  #status { color:var(--soft); font-size:0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="meta">
    유튜브 영상 요약 — 네이버 블로그용 초안<br>
    [본문 복사] 후 네이버 에디터에 붙여넣으면 소제목·이미지·링크가 함께 들어갑니다.
    이미지가 안 들어가면 이미지를 길게 눌러 저장한 뒤 에디터에서 삽입해 주세요.
  </div>
  <div class="btns">
    <button id="copyTitle" type="button">제목 복사</button>
    <button id="copyBody" class="secondary" type="button">본문 복사 (서식 유지)</button>
  </div>
  <h1 id="title"></h1>
  <hr>
  <p id="status">불러오는 중…</p>
  <article id="body"></article>
</div>
<script>
(function () {
  var status = document.getElementById("status");
  var bodyEl = document.getElementById("body");
  var titleEl = document.getElementById("title");
  var ORIGIN = "https://vet-briefing.vercel.app";

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function flash(btn, label) {
    var old = btn.textContent;
    btn.textContent = label;
    setTimeout(function () { btn.textContent = old; }, 1500);
  }

  document.getElementById("copyTitle").addEventListener("click", function () {
    var btn = this;
    navigator.clipboard.writeText(titleEl.textContent).then(function () { flash(btn, "복사되었습니다"); });
  });
  document.getElementById("copyBody").addEventListener("click", function () {
    var btn = this;
    var htmlBlob = new Blob([bodyEl.innerHTML], { type: "text/html" });
    var textBlob = new Blob([bodyEl.innerText], { type: "text/plain" });
    if (window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({ "text/html": htmlBlob, "text/plain": textBlob })])
        .then(function () { flash(btn, "복사되었습니다"); },
              function () { navigator.clipboard.writeText(bodyEl.innerText).then(function () { flash(btn, "텍스트로 복사됨"); }); });
    } else {
      navigator.clipboard.writeText(bodyEl.innerText).then(function () { flash(btn, "텍스트로 복사됨"); });
    }
  });

  function render(d, p) {
    titleEl.textContent = p.naver_title || p.title;
    var base = ORIGIN + "/insta-yt/" + d + "/";
    var html = "";
    (p.intro || []).forEach(function (t) { html += "<p>" + esc(t) + "</p>"; });
    (p.items || []).forEach(function (it) {
      html += "<h3>" + esc(it.title) + "</h3>";
      if (it.image) html += '<p><img src="' + base + it.image + '" alt="' + esc(it.title) + '"></p>';
      html += "<p>" + esc(it.body) + "</p>";
    });
    if (p.video_url) {
      html += "<p><b>전체 영상 보러가기</b><br><a href=\"" + p.video_url + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + p.video_url + "</a></p>";
    }
    html += "<p>유튜브에서 '수의사 이태호'를 검색하시면 더 많은 영상을 보실 수 있습니다.</p>";
    bodyEl.innerHTML = html;
    status.textContent = "";
  }

  var d = new URLSearchParams(location.search).get("d");
  function tryLoad(date) {
    return fetch("../insta-yt/" + date + "/post.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (p) { render(date, p); });
  }
  if (d) {
    tryLoad(d).catch(function () { status.textContent = "이 날짜의 요약을 불러오지 못했습니다."; });
  } else {
    fetch("../insta-yt/manifest.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (m) { return tryLoad(m.latest); })
      .catch(function () { status.textContent = "목록을 불러오지 못했습니다."; });
  }
})();
</script>
</body>
</html>

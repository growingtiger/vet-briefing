<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>유튜브 고관절탈구, 방광결석 칼 안대고 해결하는 획기적인 방법 카드와 네이버 초안</title><style>:root{--paper:#fdfaf3;--ink:#2a251f;--ink2:#5b5245;--ink3:#8b8070;--line:#e6dcc8;--gold:#a8802f}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all}
main{max-width:760px;margin:0 auto;padding:26px 16px 70px}
.lab{font-size:12px;letter-spacing:.12em;color:var(--gold);font-weight:700}h1{font-size:21px;margin:6px 0 4px}
h2{font-size:17px;margin:30px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
button,.btn{font:inherit;font-weight:600;font-size:14px;background:var(--ink);color:#fff;border:0;padding:9px 16px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
button.ok{background:var(--gold)}.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.box{border:1px solid var(--line);background:#fff;padding:14px;white-space:pre-wrap;line-height:1.75;font-size:15px;margin-top:8px}
.note{font-size:14px;color:var(--ink2);line-height:1.6;margin:6px 0 0}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.imgs figure{margin:0;display:grid;gap:6px}.imgs img{width:100%;height:auto;border:1px solid var(--line);display:block}</style></head><body><main><p class="lab">리플레이</p><h1>유튜브 고관절탈구, 방광결석 칼 안대고 해결하는 획기적인 방법 카드와 네이버 초안</h1><h2>인스타그램 카드 7장</h2><p class="note">카드마다 저장 버튼이 있고, 카드 페이지에서 전체 다운로드와 게시글 텍스트 복사를 하실 수 있습니다.</p><div class="links"><a class="btn" href="https://vet-briefing.vercel.app/insta-yt/" target="_blank" rel="noopener">카드 페이지 열기</a></div><div class="imgs"><figure><img src="https://vet-briefing.vercel.app/insta-yt/2026-10-09/00-cover.png" alt="" loading="lazy"><a class="btn" href="https://vet-briefing.vercel.app/insta-yt/2026-10-09/00-cover.png" download>저장</a></figure><figure><img src="https://vet-briefing.vercel.app/insta-yt/2026-10-09/01.png" alt="" loading="lazy"><a class="btn" href="https://vet-briefing.vercel.app/insta-yt/2026-10-09/01.png" download>저장</a></figure><figure><img src="https://vet-briefing.vercel.app/insta-yt/2026-10-09/02.png" alt="" loading="lazy"><a class="btn" href="https://vet-briefing.vercel.app/insta-yt/2026-10-09/02.png" download>저장</a></figure><figure><img src="https://vet-briefing.vercel.app/insta-yt/2026-10-09/03.png" alt="" loading="lazy"><a class="btn" href="https://vet-briefing.vercel.app/insta-yt/2026-10-09/03.png" download>저장</a></figure><figure><img src="https://vet-briefing.vercel.app/insta-yt/2026-10-09/04.png" alt="" loading="lazy"><a class="btn" href="https://vet-briefing.vercel.app/insta-yt/2026-10-09/04.png" download>저장</a></figure><figure><img src="https://vet-briefing.vercel.app/insta-yt/2026-10-09/05.png" alt="" loading="lazy"><a class="btn" href="https://vet-briefing.vercel.app/insta-yt/2026-10-09/05.png" download>저장</a></figure><figure><img src="https://vet-briefing.vercel.app/insta-yt/2026-10-09/06.png" alt="" loading="lazy"><a class="btn" href="https://vet-briefing.vercel.app/insta-yt/2026-10-09/06.png" download>저장</a></figure></div><h2>네이버 블로그 초안</h2><p class="note">초안 페이지에서 제목 복사와 본문 복사 버튼을 눌러 네이버에 붙여 넣으시면 됩니다.</p><div class="links"><a class="btn" href="https://vet-briefing.vercel.app/drafts/yt-naver.html?d=2026-10-09" target="_blank" rel="noopener">네이버 초안 열기</a></div></main><script>document.querySelectorAll("button[data-t]").forEach(function(b){b.onclick=function(){var el=document.getElementById(b.dataset.t),t=el.innerText,lab=b.textContent;
function ok(){b.textContent="복사했습니다";b.classList.add("ok");setTimeout(function(){b.textContent=lab;b.classList.remove("ok")},1500)}
function sel(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand("copy");ok()}catch(e){}}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,sel)}else sel();}});</script></body></html>
